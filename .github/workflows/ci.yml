name: CI

on:
  push:
    branches:
      - main
      - "polish-*"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install tools
        run: |
          python -m pip install ruff==0.8.6
          npm ci

      # Run every check so one failure does not hide the others.
      - name: Ruff lint
        if: ${{ !cancelled() }}
        run: ruff check .

      - name: Ruff format
        if: ${{ !cancelled() }}
        run: ruff format --check .

      - name: Prettier
        if: ${{ !cancelled() }}
        run: npm run format:check

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall app

      - name: Run test suite
        run: python -m pytest -q

      - name: Run eval suite
        run: python -m pytest tests/test_eval.py -s

  mutation:
    name: Random mutation testing
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # run_id stays the same on "Re-run", so a failure cannot be retried away.
      - name: Run mutation gate
        run: python scripts/mutation_test.py --seed ${{ github.run_id }} --samples 150 --min-score 80

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-report.json
          if-no-files-found: ignore
